<form (ngSubmit)="onSubmit()">
  <div class="d-grid gap-3">
    <input
      type="text"
      class="form-control mb"
      name="searchTerm"
      id="searchTerm"
      [(ngModel)]="searchTerm"
      placeholder="Search Movie..."
    />
    <input type="submit" value="Search" class="btn btn-primary btn-block" />
  </div>
</form>
