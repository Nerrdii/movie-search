<div class="row">
  <div class="col-md-6 mx-auto">
    <app-search-bar (search)="onSearch($event)"></app-search-bar>
  </div>
</div>
@if (movies$ | async; as movies) {
  <div class="card-deck mt-5">
    @for (movie of movies; track movie) {
      <app-movie-item [movie]="movie"></app-movie-item>
    }
  </div>
}
